apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Общие для всех окружений манифесты. Namespace, хост и тег образа задают overlays.
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# ConfigMap собирается генератором: к имени добавляется хэш содержимого,
# поэтому любое изменение конфига само перезапускает поды при apply
configMapGenerator:
  - name: invest-api-config
    envs:
      - config.env
