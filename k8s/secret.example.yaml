# Шаблон — не коммитьте реальные значения.
# CD-пайплайн (.github/workflows/ci-cd.yml) сам создаёт этот secret при каждом деплое
# из секретов репозитория GitHub: TINKOFF_TOKEN, DB_URL, DB_USERNAME, DB_PASSWORD.
#
# Для ручного деплоя без CI:
#
#   kubectl create secret generic invest-api-secret \
#     --namespace invest-api \
#     --from-literal=TOKEN=<your-tinkoff-token> \
#     --from-literal=DB_URL=jdbc:postgresql://<host>:5432/<db> \
#     --from-literal=DB_USERNAME=<user> \
#     --from-literal=DB_PASSWORD=<password>
#
# Либо заполните поля ниже и примените: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: invest-api-secret
  namespace: invest-api
type: Opaque
stringData:
  TOKEN: "REPLACE_ME"
  DB_URL: "jdbc:postgresql://REPLACE_ME:5432/postgres"
  DB_USERNAME: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
