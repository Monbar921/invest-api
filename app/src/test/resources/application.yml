server:
  port: 8099

invest:
  enabled: true
  connector:
    token: token

ru:
  invest:
    api:
      stock:
        supplier:
          scheduler:
            enabled: false
            cron: "0 0 0 * * ?"
spring:
  cache:
    type: caffeine
  cloud:
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      client:
        config:
          invest-api-client:
            url: http://localhost:8099
          cb-rf-client:
            enabled: true
            url: https://www.cbr.ru/
          budget-org-client:
            enabled: true
            url: https://api.budjet.org/
  datasource:
    hikari:
      connection-test-query: select 1
      connection-init-sql: SET search_path TO public
      connection-timeout: 30000
      driver-class-name: org.postgresql.Driver
      idle-timeout: 30000
      max-lifetime: 40000
      maximum-pool-size: 15
      minimum-idle: 15
      pool-name: postgres
      password: password
      jdbc-url: jdbc:postgresql://localhost:5432/postgres
      username: username