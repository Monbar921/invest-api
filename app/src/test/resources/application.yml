server:
  port: 8099

invest:
  enabled: false
  connector:
    token: TOKEN

ru:
  invest:
    api:
      # адреса UI, которым можно ходить в API облигаций из браузера (через запятую в RU_INVEST_API_CORS_ALLOWED_ORIGINS)
      cors:
        allowed-origins: http://localhost:5173
      stock:
        supplier:
          scheduler:
            sync:
              enabled: false
              cron: "0 0 0 * * ?"
            price:
              enabled: false
              cron: "0 0 0 * * ?"
spring:
  cache:
    type: caffeine
  cloud:
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      client:
        config:
          invest-api-client:
            url: http://localhost:8099
          cb-rf-client:
            enabled: true
            url: https://www.cbr.ru/
          budget-org-client:
            enabled: true
            url: https://api.budjet.org/
  datasource:
    hikari:
      connection-test-query: select 1
      connection-init-sql: SET search_path TO public
      connection-timeout: 30000
      driver-class-name: org.postgresql.Driver
      idle-timeout: 30000
      max-lifetime: 40000
      maximum-pool-size: 15
      minimum-idle: 15
      pool-name: postgres
      password: password
      jdbc-url: jdbc:postgresql://localhost:5432/postgres
      username: username
  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
    parameters:
      appUsername: ${spring.datasource.hikari.username}
      schema: public
      sql_schema: public
    enabled: true
    default-schema: public