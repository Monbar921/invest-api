server:
  port: 8099

invest:
  enabled: false
  connector:
    token: TOKEN

ru:
  invest:
    api:
      stock:
        supplier:
          scheduler:
            sync:
              enabled: false
              cron: "0 0 0 * * ?"
            price:
              enabled: false
              cron: "0 0 0 * * ?"
      # шедулер новостей выключен: NewsTest вызывает загрузку сам; адреса - для мока NewsHttpClient
      news:
        acra-url: https://acra.test/press-releases/
        nkr-url: https://nkr.test/ratings/press-releases/
        key-rate-meetings: [2026-09-11, 2026-10-23]
        feeds:
          - source: INTERFAX
            url: https://interfax.test/rss
            only-matched: true
          - source: VEDOMOSTI
            url: https://vedomosti.test/rss
            only-matched: false
      # проверка правил и разбор очереди вызываются из AlertTest напрямую
      alerts:
        price-check-on-sync: false
        news-check-on-sync: false
        scheduler:
          enabled: false
        dispatcher:
          enabled: false
      # партнёры для BrokerLinkTest: включённый с erid, включённый без erid и выключенный
      broker-referral:
        partners:
          - id: alpha
            name: Альфа Брокер
            url-template: https://alpha.test/bonds/{isin}?ref=invest&erid={erid}
            advertiser: АО "Альфа Брокер", ИНН 7700000001
            erid: 2SDnjAlpha
          - id: beta
            name: Бета Инвест
            url-template: https://beta.test/buy?ticker={ticker}
            advertiser: ООО "Бета Инвест", ИНН 7700000002
          - id: gamma
            name: Гамма
            url-template: https://gamma.test/{ticker}
            advertiser: ООО "Гамма", ИНН 7700000003
            enabled: false
      # бот включён без long polling и проверки связи: TelegramTest вызывает обработчик сам, клиент замокан
      telegram:
        enabled: true
        polling: false
        bot-token: TEST
        bot-username: invest_test_bot
spring:
  jpa:
    # без этого EntityManager живёт весь HTTP-запрос: ручная синхронизация свечей копила в нём сотни тысяч
    # сохранённых сущностей и падала по памяти (OOMKilled на лимите 1 ГБ). Данные грузятся в @Transactional
    open-in-view: false
  cache:
    type: caffeine
  cloud:
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      client:
        config:
          invest-api-client:
            url: http://localhost:8099
          cb-rf-client:
            enabled: true
            url: https://www.cbr.ru/
          budget-org-client:
            enabled: true
            url: https://api.budjet.org/
          moex-iss-client:
            enabled: true
            url: https://iss.moex.com/
  datasource:
    hikari:
      connection-test-query: select 1
      connection-init-sql: SET search_path TO public
      connection-timeout: 30000
      driver-class-name: org.postgresql.Driver
      idle-timeout: 30000
      max-lifetime: 40000
      maximum-pool-size: 15
      minimum-idle: 15
      pool-name: postgres
      password: password
      jdbc-url: jdbc:postgresql://localhost:5432/postgres
      username: username
  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
    parameters:
      appUsername: ${spring.datasource.hikari.username}
      schema: public
      sql_schema: public
    enabled: true
    default-schema: public
