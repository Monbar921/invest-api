invest:
  enabled: true
  connector:
    token: $TOKEN
    # retry из SDK: повторяет только RESOURCE_EXHAUSTED, ждёт до сброса лимита (x-ratelimit-reset)
    connection:
      retry:
        max-attempts: 3
        wait-duration: 2000
  # клиентские лимиты по методам, лимиты сервера: developer.tbank.ru/invest/intro/intro/limits
  rate-limiter:
    bond-coupons:
      requests: 3
      period: 1s
    bonds:
      requests: 1
      period: 5s
    last-prices:
      requests: 9
      period: 1s
    candles:
      requests: 5
      period: 1s
    default-limit:
      requests: 1
      period: 1s
    timeout: 60s
    max-concurrent-calls: 25

ru:
  invest:
    api:
      stock:
        supplier:
          scheduler:
            # ночная цепочка: облигации -> купоны -> цены + доходность купонов
            sync:
              enabled: false
              run-on-startup: true
              cron: "0 0 3 * * *"
              zone: Europe/Moscow
              steps:
                bond: true
                coupon: true
                price: true
            # частое обновление цен и доходности в торговые часы
            price:
              enabled: true
              cron: "0 */15 7-23 * * MON-FRI"
              zone: Europe/Moscow
      # лента новостей: эмитенты (раз в сутки), RSS Банка России, новости Мосбиржи
      news:
        scheduler:
          enabled: true
          run-on-startup: true
          cron: "0 */15 * * * *"
          zone: Europe/Moscow
        # рейтинговые действия: HTML-списки, RSS у агентств нет
        acra-url: https://www.acra-ratings.ru/press-releases/
        nkr-url: https://ratings.ru/ratings/press-releases/
        # заседания ЦБ по ключевой ставке (день решения); календарь на следующий год ЦБ публикует осенью - дописать
        key-rate-meetings: [2026-02-13, 2026-03-20, 2026-04-24, 2026-06-19, 2026-07-24, 2026-09-11, 2026-10-23, 2026-12-18]
        # RSS СМИ; only-matched - общая лента, из неё берутся только новости про выпуски и эмитентов из системы
        feeds:
          - source: INTERFAX
            url: https://www.interfax.ru/rss.asp
            only-matched: true
          - source: RBC
            url: https://rssexport.rbc.ru/rbcnews/news/30/full.rss
            only-matched: true
          - source: SMART_LAB
            url: https://smart-lab.ru/rss/
            only-matched: true
          - source: KOMMERSANT
            url: https://www.kommersant.ru/RSS/section-economics.xml
            only-matched: false
          - source: VEDOMOSTI
            url: https://www.vedomosti.ru/rss/rubric/finance
            only-matched: false
          - source: FINAM
            url: https://www.finam.ru/analysis/conews/rsspoint/
            only-matched: false
          - source: FRANK_MEDIA
            url: https://frankmedia.ru/feed
            only-matched: false
      # уведомления по облигациям (docs/features/INVEST-001-telegram-bot)
      alerts:
        max-days: 60
        zone: Europe/Moscow
        # проверка правил по датам: утром и сразу после старта
        scheduler:
          enabled: true
          cron: "0 0 9 * * *"
          zone: Europe/Moscow
        # правила по цене и доходности - после каждого обновления цен (scheduler.price и шаг price ночной цепочки)
        price-check-on-sync: true
        # правила по новостям, рейтингам и ключевой ставке - после каждой загрузки ленты (news.scheduler)
        news-check-on-sync: true
        # очередь отправки: повторы при сбоях связи, отказ через сутки
        dispatcher:
          enabled: true
          interval: PT30S
          batch-size: 50
        give-up-after: PT24H
        retention: P90D
      # блок «Купить у брокера» (docs/features/INVEST-001-broker-referral); пустой список - блок не показывается.
      # Партнёр: id (постоянный, по нему считаются клики), name, url-template (https, подстановки {ticker} {isin}
      # {erid}), advertiser (наименование и ИНН для маркировки), erid (токен ЕРИР), enabled
      broker-referral:
        zone: Europe/Moscow
        partners:
        - id: tbank
          name: Т-Инвестиции
          url-template: https://tbank-online.com/baf/5e0hKcs113i
          advertiser: АО "ТБанк", ИНН 7710140679
          erid: 123
      # тарифы (docs/features/INVEST-001-plans): лимиты и фичи. Значения - заготовка до решения владельца о составе и
      # ценах тарифов (roadmap, 0.4): бесплатный повторяет прежние лимиты (50 правил, 200 покупок). id тарифа хранится
      # в подписках - не менять у выданных. limits - все из PlanLimit, features - включённые из PlanFeature
      plans:
        default-plan: free
        zone: Europe/Moscow
        plans:
          free:
            title: Бесплатный
            description: Облигации, калькулятор, портфель и уведомления в Telegram
            paid: false
            limits:
              ALERTS: 50
              PORTFOLIO_POSITIONS: 200
            features: [CALENDAR_ICS]
          premium:
            title: Премиум
            description: Больше правил уведомлений и покупок в портфеле
            paid: true
            limits:
              ALERTS: 500
              PORTFOLIO_POSITIONS: 2000
            features: [CALENDAR_ICS]
      # Telegram-бот (docs/features/INVEST-001-telegram-bot); токен - только из переменной окружения
      telegram:
        enabled: ${TELEGRAM_BOT_ENABLED:false}
        bot-token: ${TELEGRAM_BOT_TOKEN:}
        bot-username: ${TELEGRAM_BOT_USERNAME:}
        link-token-ttl: PT10M
        availability-check-interval: PT5M
        # NONE - напрямую или через TUN VPN; HTTP / SOCKS - локальный прокси (sing-box), см. proxy.md
        proxy:
          type: ${TELEGRAM_PROXY_TYPE:NONE}
          host: ${TELEGRAM_PROXY_HOST:127.0.0.1}
          port: ${TELEGRAM_PROXY_PORT:2080}

spring:
  # 4 потока на @Scheduled: разбор очереди уведомлений (раз в 30 с) не ждёт долгих синхронизаций
  task:
    scheduling:
      pool:
        size: 4
  jpa:
    # без этого EntityManager живёт весь HTTP-запрос: ручная синхронизация свечей копила в нём сотни тысяч
    # сохранённых сущностей и падала по памяти (OOMKilled на лимите 1 ГБ). Данные грузятся в @Transactional
    open-in-view: false
  cache:
    type: caffeine
  cloud:
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      client:
        config:
          cb-rf-client:
            enabled: true
            url: https://www.cbr.ru/
          budget-org-client:
            enabled: true
            url: https://api.budjet.org/
          moex-iss-client:
            enabled: true
            url: https://iss.moex.com/
  datasource:
    hikari:
      connection-test-query: select 1
      connection-init-sql: SET search_path TO $DB_SCHEMA
      connection-timeout: 30000
      driver-class-name: org.postgresql.Driver
      idle-timeout: 30000
      max-lifetime: 40000
      maximum-pool-size: 15
      minimum-idle: 15
      pool-name: postgres
      jdbc-url: jdbc:postgresql://$DB_HOST:DB_PORT/$DB_NAME
      username: $DB_USERNAME
      password: $DB_PASSWORD

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
