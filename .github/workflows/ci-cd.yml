name: CI/CD

# Логика по веткам:
#   pull request в master/develop/uat -> сборка, checkstyle и тесты
#   push в develop/uat                -> + образ в ghcr.io (теги: <short sha>, <ветка>)
#   push в master                     -> + образ (дополнительно тег latest)
# Деплой в Kubernetes ручной, см. k8s/README.md
on:
  push:
    branches: [ "master", "develop", "uat" ]
  pull_request:
    branches: [ "master", "develop", "uat" ]
  workflow_dispatch:

# новый push в ту же ветку/PR отменяет незавершённую сборку предыдущего
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: "25"

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-java заодно пишет ~/.m2/toolchains.xml, который нужен maven-toolchains-plugin
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # checkstyle (validate), тесты (Testcontainers использует Docker раннера)
      # и раскладка для образа в app/target/dockerbuild (package)
      - name: Build, checkstyle and tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

      - name: Upload image layout
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dockerbuild
          path: app/target/dockerbuild/
          if-no-files-found: error
          retention-days: 3

  image:
    name: Build & push image
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      contains(fromJSON('["refs/heads/master", "refs/heads/develop", "refs/heads/uat"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image layout
        uses: actions/download-artifact@v4
        with:
          name: dockerbuild
          path: app/target/dockerbuild

      # ghcr.io принимает имена только в нижнем регистре
      - name: Image name
        id: name
        run: |
          name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

